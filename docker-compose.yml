# Gaming Hub — stack sans Mongo local (env par service, voir Setup_env.md à la racine du monorepo)
# Prérequis : fichiers backend/services/*/.env et backend/gateway/.env
# docker compose up --build -d

services:
  auth-service:
    build:
      context: .
      dockerfile: backend/services/auth-service/Dockerfile
    container_name: gaming-hub-auth
    ports:
      - "4001:4001"
    env_file:
      - backend/services/auth-service/.env
    environment:
      NODE_ENV: production
      PORT: 4001
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    networks:
      - gaming-hub

  catalog-service:
    build:
      context: .
      dockerfile: backend/services/catalog-service/Dockerfile
    container_name: gaming-hub-catalog
    ports:
      - "4002:4002"
    env_file:
      - backend/services/catalog-service/.env
    environment:
      NODE_ENV: production
      PORT: 4002
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    networks:
      - gaming-hub

  analytics-service:
    build:
      context: .
      dockerfile: backend/services/analytics-service/Dockerfile
    container_name: gaming-hub-analytics
    ports:
      - "4004:4004"
    env_file:
      - backend/services/analytics-service/.env
    environment:
      NODE_ENV: production
      PORT: 4004
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    networks:
      - gaming-hub

  roguelike-service:
    build:
      context: .
      dockerfile: backend/services/roguelike-service/Dockerfile
    container_name: gaming-hub-roguelike
    ports:
      - "4003:4003"
    env_file:
      - backend/services/roguelike-service/.env
    environment:
      NODE_ENV: production
      PORT: 4003
      ANALYTICS_GRAPHQL_URL: http://analytics-service:4004/graphql
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      - analytics-service
    networks:
      - gaming-hub

  gateway:
    build:
      context: .
      dockerfile: backend/gateway/Dockerfile
    container_name: gaming-hub-gateway
    ports:
      - "4000:4000"
    env_file:
      - backend/gateway/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      AUTH_SUBGRAPH_URL: http://auth-service:4001/graphql
      CATALOG_SUBGRAPH_URL: http://catalog-service:4002/graphql
      ROGUELIKE_SUBGRAPH_URL: http://roguelike-service:4003/graphql
      ANALYTICS_SUBGRAPH_URL: http://analytics-service:4004/graphql
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      - auth-service
      - catalog-service
      - roguelike-service
      - analytics-service
    networks:
      - gaming-hub

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_GRAPHQL_URL: http://localhost:4000/graphql
        NEXT_PUBLIC_GAME_HOST_URL: http://localhost:3000/games
    container_name: gaming-hub-frontend
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    networks:
      - gaming-hub

networks:
  gaming-hub:
    driver: bridge
