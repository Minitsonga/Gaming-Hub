name: Auto PR to Main

on:
  push:
    branches: [staging]

jobs:
  create-pr:
    name: Create PR staging → main
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: staging
          base: main
          title: 'Release: staging -> main'
          body: |
            ## Prêt pour Production !
            
            **Tous les tests sont passés :**
            - Lint & Format
            - Build TypeScript
            - Tests unitaires
            
              **Cette PR nécessite une validation manuelle avant merge.**
          labels: release, production
