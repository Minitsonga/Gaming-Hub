name: Lint & Format

on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  lint-format:
    name: lint-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check
