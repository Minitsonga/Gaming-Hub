# Publication d'une image sur Docker Hub au push d'un tag (ex. auth-service/v1.0.1).
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN

name: Docker Publish (tag)

on:
  push:
    tags:
      - 'gateway/v*.*.*'
      - 'auth-service/v*.*.*'
      - 'catalog-service/v*.*.*'
      - 'roguelike-service/v*.*.*'
      - 'analytics-service/v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          SERVICE="${TAG%/*}"
          VERSION="${TAG##*/v}"
          echo "service=$SERVICE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Workspace et Dockerfile
        id: paths
        run: |
          case "${{ steps.tag.outputs.service }}" in
            gateway)
              WORKSPACE="backend/gateway"
              DOCKERFILE="backend/gateway/Dockerfile"
              IMAGE_NAME="gaming-hub-gateway"
              ;;
            auth-service)
              WORKSPACE="backend/services/auth-service"
              DOCKERFILE="backend/services/auth-service/Dockerfile"
              IMAGE_NAME="gaming-hub-auth-service"
              ;;
            catalog-service)
              WORKSPACE="backend/services/catalog-service"
              DOCKERFILE="backend/services/catalog-service/Dockerfile"
              IMAGE_NAME="gaming-hub-catalog-service"
              ;;
            roguelike-service)
              WORKSPACE="backend/services/roguelike-service"
              DOCKERFILE="backend/services/roguelike-service/Dockerfile"
              IMAGE_NAME="gaming-hub-roguelike-service"
              ;;
            analytics-service)
              WORKSPACE="backend/services/analytics-service"
              DOCKERFILE="backend/services/analytics-service/Dockerfile"
              IMAGE_NAME="gaming-hub-analytics-service"
              ;;
            *)
              echo "Service inconnu: ${{ steps.tag.outputs.service }}"
              exit 1
              ;;
          esac
          echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT
          echo "dockerfile=$DOCKERFILE" >> $GITHUB_OUTPUT
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Vérifier version package.json
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          PKG_VERSION=$(node -p "require('./${{ steps.paths.outputs.workspace }}/package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "Version tag ($VERSION) != package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Short SHA
        id: sha
        run: echo "short_sha=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.paths.outputs.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.paths.outputs.image_name }}:${{ steps.tag.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.paths.outputs.image_name }}:sha-${{ steps.sha.outputs.short_sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.paths.outputs.image_name }}:latest
