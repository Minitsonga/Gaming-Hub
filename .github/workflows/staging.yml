# CI dev -> staging / main
# - PR (staging ou main): lint + format + test + build (validation, pas de push).
# - Push sur staging: en plus, build + push des images Docker avec versions package.json.
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN

name: Staging

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: lint-test-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test --workspaces --if-present

      - name: Build
        run: npm run build --workspaces

  build-and-push:
    name: docker-push
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    strategy:
      matrix:
        include:
          - workspace: backend/gateway
            dockerfile: backend/gateway/Dockerfile
            image: gaming-hub-gateway
          - workspace: backend/services/auth-service
            dockerfile: backend/services/auth-service/Dockerfile
            image: gaming-hub-auth-service
          - workspace: backend/services/catalog-service
            dockerfile: backend/services/catalog-service/Dockerfile
            image: gaming-hub-catalog-service
          - workspace: backend/services/roguelike-service
            dockerfile: backend/services/roguelike-service/Dockerfile
            image: gaming-hub-roguelike-service
          - workspace: backend/services/analytics-service
            dockerfile: backend/services/analytics-service/Dockerfile
            image: gaming-hub-analytics-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version et SHA
        id: meta
        run: |
          VERSION=$(node -p "require('./${{ matrix.workspace }}/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:sha-${{ steps.meta.outputs.short_sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
