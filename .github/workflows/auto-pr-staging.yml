name: Auto PR to Staging

on:
  push:
    branches: [test]

jobs:
  create-pr:
    name: Create PR test → staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: test
          base: staging
          title: 'Auto PR: test -> staging'
          body: |
            ## Tests d'intégration passés !
            
            Cette PR a été créée automatiquement car tous les tests sur `test` ont réussi.
            
            **Prochaine étape :** Merge dans `staging` pour lancer les tests unitaires.
          labels: auto-pr, staging
