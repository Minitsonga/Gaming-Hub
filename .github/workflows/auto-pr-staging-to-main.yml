name: Auto PR staging -> main

on:
  push:
    branches: [staging]

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create PR staging → main (if none exists)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:staging`;
            const base = 'main';

            const existing = await github.rest.pulls.list({
              owner, repo, state: 'open', head, base
            });

            if (existing.data.length > 0) {
              core.info(`PR already exists: #${existing.data[0].number}`);
              return;
            }

            const pr = await github.rest.pulls.create({
              owner, repo,
              title: 'Release: staging -> main',
              head: 'staging',
              base: 'main',
              body: `PR de release créée automatiquement après merge dans staging.\n\n Vérifie les checks CI avant de merger dans main.`
            });

            core.info(`Created PR: #${pr.data.number}`);
