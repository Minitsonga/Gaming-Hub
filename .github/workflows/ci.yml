name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  lint-build-test:
    name: lint-build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (workspaces)
        run: npm -ws run build

      # Active ces 2 lignes seulement quand tu as vraiment lint/tests
      # - name: Lint (workspaces)
      #   run: npm -ws run lint
      # - name: Test (workspaces)
      #   run: npm -ws run test
